name: s3_client
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  bcrypt: ^1.1.3
  crypto: ^3.0.6
  dio: ^5.7.0
  file_picker: ^8.1.7
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_launcher_icons: ^0.14.3
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  get: ^4.6.6
  http: ^1.3.0
  intl: ^0.19.0
  minio: ^3.5.7
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/.env

  fonts:
  - family: serif
    fonts:
      - asset: assets/fonts/serif.ttf
  - family: monospace
    fonts:
      - asset: assets/fonts/monospace.ttf
  - family: cursive
    fonts:
      - asset: assets/fonts/cursive.ttf

flutter_launcher_icons:
  android:  "ic_launcher"
  ios: "AppIcon"
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#c37022"
  background_color_android: "#c37022"
